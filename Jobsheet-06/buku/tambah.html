<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIMPUS-Mini | Tambah Buku</title>
    <!-- CDN Bootstrap 5.3.3 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body class="bg-light">

    <!-- Header Navbar Bootstrap -->
    <header class="navbar navbar-expand-md navbar-dark bg-primary shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-semibold" href="../index.html">SIMPUS-Mini</a>
            <button type="button" id="nav-toggle-btn" class="nav-toggle-label navbar-toggler" aria-label="Menu">&#9776;</button>
            <nav class="collapse navbar-collapse" id="navMenu">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="../index.html">Beranda</a></li>
                    <li class="nav-item"><a class="nav-link" href="list.html">Daftar Buku</a></li>
                    <li class="nav-item"><a class="nav-link active" href="tambah.html">Tambah Buku</a></li>
                    <li class="nav-item"><a class="nav-link" href="../anggota/list.html">Daftar Anggota</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <!-- Main Container Form -->
    <main class="container my-4">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">
                <section class="card shadow-sm border-0">
                    <div class="card-body p-4">
                        <h2 class="card-title h4 mb-4 text-primary fw-bold">Tambah Buku</h2>
                        
                        <!-- SEKARANG HANYA ADA 1 TAG FORM DENGAN ID FORM-TAMBAH -->
                        <form id="form-tambah">
                            <div class="mb-3">
                                <label for="judul" class="form-label fw-semibold">Judul Buku <span class="text-danger">*wajib</span></label>
                                <input type="text" class="form-control" id="judul" name="judul" placeholder="Masukkan judul buku">
                            </div>

                            <div class="mb-3">
                                <label for="pengarang" class="form-label fw-semibold">Pengarang</label>
                                <input type="text" class="form-control" id="pengarang" name="pengarang" placeholder="Masukkan nama pengarang">
                            </div>

                            <div class="mb-3">
                                <label for="tahun" class="form-label fw-semibold">Tahun Terbit</label>
                                <input type="number" class="form-control" id="tahun" name="tahun" placeholder="Contoh: 2024">
                            </div>

                            <div class="mb-3">
                                <label for="isbn" class="form-label fw-semibold">ISBN</label>
                                <input type="text" class="form-control" id="isbn" name="isbn" placeholder="Nomor ISBN">
                            </div>

                            <div class="mb-3">
                                <label for="stok" class="form-label fw-semibold">Jumlah Stok</label>
                                <input type="number" class="form-control" id="stok" name="stok" placeholder="Jumlah stok">
                            </div>

                            <div class="mb-4">
                                <label for="kategori" class="form-label fw-semibold">Kategori</label>
                                <select class="form-select" id="kategori" name="kategori">
                                    <option value="Fiksi">Fiksi</option>
                                    <option value="Non-Fiksi">Non-Fiksi</option>
                                    <option value="Teknologi">Teknologi</option>
                                    <option value="Sains">Sains</option>
                                </select>
                            </div>

                            <button type="submit" class="btn btn-primary w-100">Simpan Buku</button>
                        </form>
                    </div>
                </section>
            </div>
        </div>
    </main>

    <footer class="text-center py-3 text-muted">
        <p class="mb-0">&copy; 2026 SIMPUS-Mini &mdash; Jobsheet 5</p>
    </footer>

    <!-- Script JS Utama -->
    <script src="../assets/js/app.js"></script>
</body>
</html>
