<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIMPUS-Mini | Daftar Buku</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body class="bg-light">

    <header class="navbar navbar-expand-md navbar-dark bg-primary shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-semibold" href="../index.html">SIMPUS-Mini</a>
            <button type="button" id="nav-toggle-btn" class="nav-toggle-label navbar-toggler" aria-label="Menu">&#9776;</button>
            <nav class="collapse navbar-collapse" id="navMenu">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="../index.html">Beranda</a></li>
                    <li class="nav-item"><a class="nav-link active" href="list.html">Daftar Buku</a></li>
                    <li class="nav-item"><a class="nav-link" href="tambah.html">Tambah Buku</a></li>
                    <li class="nav-item"><a class="nav-link" href="../anggota/list.html">Daftar Anggota</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container my-4">
        <div class="card shadow-sm border-0 p-4">
            <h2 class="card-title h4 mb-3 text-primary fw-bold">Daftar Buku</h2>

            <div class="search-box mb-3">
                <label for="search-input" class="form-label fw-semibold">Cari Buku:</label>
                <input type="text" id="search-input" class="form-control" placeholder="Ketik kata kunci...">
                <p id="table-counter" class="text-muted small mt-2 mb-0"></p>
            </div>

            <!-- Loading Indicator Jobsheet 6 -->
            <p id="loading-indicator" class="text-info fw-bold" style="display: none;">Memuat data...</p>

            <div class="table-responsive">
                <div class="mb-3 text-end">
    <button type="button" id="btn-reload" class="btn btn-outline-primary btn-sm">
         Muat Ulang Data
    </button>
</div>
                <table class="table table-striped table-hover align-middle text-center">
                    <thead class="table-primary">
                        <tr>
                            <th>Judul Buku</th>
                            <th>Pengarang</th>
                            <th>Tahun</th>
                            <th>Stok</th>
                            <th>Kategori</th>
                            <th>Aksi</th>
                        </tr>
                    </thead>
                    <!-- tbody dikosongkan untuk diisi dinamis oleh buku.js -->
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </main>

    <footer class="text-center py-3 text-muted">
        <p class="mb-0">&copy; 2026 SIMPUS-Mini &mdash; Jobsheet 6</p>
    </footer>
    <script src="../assets/js/app.js"></script>
    <script src="../assets/js/buku.js"></script>
</body>
</html>
